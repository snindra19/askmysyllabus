[project]
name = "askmysyllabus-api"
version = "0.1.0"
description = "AskMySyllabus API: FastAPI backend, data model, migrations, and RLS"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "pgvector>=0.5",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
