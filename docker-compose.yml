name: askmysyllabus

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: askmysyllabus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: askmysyllabus-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: askmysyllabus-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

  minio:
    # Official minio/minio images are no longer published; frozen Bitnami build for local dev only.
    image: bitnamilegacy/minio:2025.7.23
    container_name: askmysyllabus-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET_PDFS:-askmysyllabus-pdfs},${S3_BUCKET_MARKDOWN:-askmysyllabus-markdown},${S3_BUCKET_BACKUPS:-askmysyllabus-backups}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    volumes:
      - minio-data:/bitnami/minio/data

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: askmysyllabus-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
    name: askmysyllabus-postgres-data
  redis-data:
    name: askmysyllabus-redis-data
  keycloak-data:
    name: askmysyllabus-keycloak-data
  minio-data:
    name: askmysyllabus-minio-data

networks:
  default:
    name: askmysyllabus-net
