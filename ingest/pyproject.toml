[project]
name = "askmysyllabus-ingest"
version = "0.1.0"
description = "AskMySyllabus ingestion: PDF conversion and processing worker"
requires-python = ">=3.12"
dependencies = []

# Conversion runs on the laptop or a temporary job, never in the worker image.
[dependency-groups]
convert = [
    "docling>=2.150.1",
    "marker-pdf>=2.2.0",
    "pymupdf4llm>=2.1",
    "rapidocr>=3.10.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "wordfreq>=3.1.1",
]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
